[package]
name = "muse-cli-rust"
version = "0.3.2"
edition = "2021"
description = "Rust rewrite of muse-cli: talk to your personal muse.ai AI agent from the terminal."
license = "MIT"

[[bin]]
name = "muse-cli"
path = "src/main.rs"

[lib]
name = "muse_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
snow = "0.9"
prost = "0.13"
prost-types = "0.13"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
url = "2"
percent-encoding = "2"

[dev-dependencies]
